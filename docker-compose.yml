x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  rest.address: flink-jobmanager
  jobmanager.execution.failover-strategy: full
  restart-strategy.type: failure-rate
  restart-strategy.failure-rate.max-failures-per-interval: 3
  restart-strategy.failure-rate.failure-rate-interval: 5 min
  restart-strategy.failure-rate.delay: 10 s
  state.backend.type: hashmap
  state.checkpoints.dir: s3://${MINIO_FLINK_BUCKET:-flink-state}/checkpoints
  state.savepoints.dir: s3://${MINIO_FLINK_BUCKET:-flink-state}/savepoints
  s3.endpoint: http://minio:9000
  s3.path.style.access: true
  s3.access-key: ${MINIO_ROOT_USER:-minioadmin}
  s3.secret-key: ${MINIO_ROOT_PASSWORD:-minioadmin}
  s3.connection.ssl.enabled: false
  execution.checkpointing.interval: 30 s
  execution.checkpointing.mode: EXACTLY_ONCE
  execution.checkpointing.timeout: 3 min
  execution.checkpointing.min-pause: 10 s
  execution.checkpointing.max-concurrent-checkpoints: 1
  execution.checkpointing.tolerable-failed-checkpoints: 3
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: 9249

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      postgres-exporter:
        condition: service_started
      clickhouse:
        condition: service_healthy
      cadvisor:
        condition: service_started
      cdc-validation-exporter:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.yml:/etc/prometheus/alert.yml:ro
    networks:
      - cdc-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cdc-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - cdc-network

  cdc-validation-exporter:
    build:
      context: .
      dockerfile: monitoring/cdc-validation-exporter/Dockerfile
    container_name: cdc-validation-exporter
    environment:
      POSTGRES_HOST: pg-primary
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce_ods
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ecommerce_ods
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      VALIDATION_TIMEOUT: 60
      CDC_VALIDATION_INTERVAL_SECONDS: 300
    depends_on:
      pg-primary:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "9108:9108"
    networks:
      - cdc-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@pg-primary:5432/ecommerce_ods?sslmode=disable"
    depends_on:
      pg-primary:
        condition: service_healthy
    networks:
      - cdc-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-sink
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    environment:
      - CLICKHOUSE_DB=ecommerce_ods
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_FLINK_BUCKET: ${MINIO_FLINK_BUCKET:-flink-state}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        mc mb --ignore-existing "local/${MINIO_FLINK_BUCKET:-flink-state}" &&
        mc anonymous set none "local/${MINIO_FLINK_BUCKET:-flink-state}" &&
        mc ls "local/${MINIO_FLINK_BUCKET:-flink-state}"
    restart: "no"
    networks:
      - cdc-network

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
      - "9249:9249"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    ports:
      - "9250:9249"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://flink-jobmanager:8081/taskmanagers | grep --quiet '\"id\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  # Submit the bounded SQL statement set only after every runtime dependency is
  # actually ready. This replaces the old, timing-dependent `sleep 30`.
  flink-job-submitter:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-job-submitter
    depends_on:
      minio-init:
        condition: service_completed_successfully
      pg-primary:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
    command: /opt/flink/bin/submit-cdc-job.sh
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro
    restart: "no"
    networks:
      - cdc-network

  pg-primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_ods
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=20"
      - "-c"
      - "max_replication_slots=20"
      - "-c"
      - "listen_addresses=*"
    ports:
      - "5433:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgres-ha/primary-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_ods"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  pg-replica-1:
    image: postgres:16
    container_name: pg-replica-1
    environment:
      PGPASSWORD: repl_password
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary...';
        until gosu postgres pg_isready -h pg-primary -p 5432 -U postgres; do
          sleep 2;
        done;
        echo 'Running pg_basebackup...';
        rm -rf /var/lib/postgresql/data/*;
        gosu postgres pg_basebackup -h pg-primary -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        chmod 700 /var/lib/postgresql/data;
        echo 'Basebackup done.';
      fi;
      exec gosu postgres postgres
      "
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_ods && psql -U postgres -d ecommerce_ods -tAc 'SELECT pg_is_in_recovery()' | grep --quiet t"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network
    ports:
      - "5434:5432"

  pg-replica-2:
    image: postgres:16
    container_name: pg-replica-2
    environment:
      PGPASSWORD: repl_password
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary...';
        until gosu postgres pg_isready -h pg-primary -p 5432 -U postgres; do
          sleep 2;
        done;
        echo 'Running pg_basebackup...';
        rm -rf /var/lib/postgresql/data/*;
        gosu postgres pg_basebackup -h pg-primary -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        chmod 700 /var/lib/postgresql/data;
        echo 'Basebackup done.';
      fi;
      exec gosu postgres postgres
      "
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_ods && psql -U postgres -d ecommerce_ods -tAc 'SELECT pg_is_in_recovery()' | grep --quiet t"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network
    ports:
      - "5435:5432"

  pg-haproxy:
    image: haproxy:2.9
    container_name: pg-haproxy
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-replica-1:
        condition: service_healthy
      pg-replica-2:
        condition: service_healthy
    ports:
      - "15432:5432"
      - "15433:5433"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - cdc-network
      
volumes:
  clickhouse_data:
  grafana_data:
  minio_data:
  pg_primary_data:
  pg_replica1_data:
  pg_replica2_data:

networks:
  cdc-network:
    driver: bridge
