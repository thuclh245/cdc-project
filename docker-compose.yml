x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  rest.address: flink-jobmanager
  jobmanager.execution.failover-strategy: full
  restart-strategy.type: failure-rate
  restart-strategy.failure-rate.max-failures-per-interval: 3
  restart-strategy.failure-rate.failure-rate-interval: 5 min
  restart-strategy.failure-rate.delay: 10 s
  state.backend.type: hashmap
  state.checkpoints.dir: s3://${MINIO_FLINK_BUCKET:-flink-state}/checkpoints
  state.savepoints.dir: s3://${MINIO_FLINK_BUCKET:-flink-state}/savepoints
  s3.endpoint: http://minio:9000
  s3.path.style.access: true
  s3.access-key: ${MINIO_ROOT_USER:-minioadmin}
  s3.secret-key: ${MINIO_ROOT_PASSWORD:-minioadmin}
  s3.connection.ssl.enabled: false
  execution.checkpointing.interval: 30 s
  execution.checkpointing.mode: EXACTLY_ONCE
  execution.checkpointing.timeout: 3 min
  execution.checkpointing.min-pause: 10 s
  execution.checkpointing.max-concurrent-checkpoints: 1
  execution.checkpointing.tolerable-failed-checkpoints: 3
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: 9249

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      clickhouse:
        condition: service_healthy
      cadvisor:
        condition: service_started
      cdc-validation-exporter:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.yml:/etc/prometheus/alert.yml:ro
    networks:
      - cdc-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - cdc-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cdc-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - cdc-network

  cdc-validation-exporter:
    build:
      context: .
      dockerfile: monitoring/cdc-validation-exporter/Dockerfile
    container_name: cdc-validation-exporter
    environment:
      POSTGRES_HOST: pg-haproxy
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce_ods
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PATRONI_NODES: pg-node-1:8008,pg-node-2:8008,pg-node-3:8008
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ecommerce_ods
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      VALIDATION_TIMEOUT: 60
      CDC_VALIDATION_INTERVAL_SECONDS: 300
    depends_on:
      postgres-ready:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    ports:
      - "9108:9108"
    networks:
      - cdc-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@pg-haproxy:5432/ecommerce_ods?sslmode=disable"
    depends_on:
      postgres-ready:
        condition: service_completed_successfully
    networks:
      - cdc-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-sink
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    environment:
      - CLICKHOUSE_DB=ecommerce_ods
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_FLINK_BUCKET: ${MINIO_FLINK_BUCKET:-flink-state}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        mc mb --ignore-existing "local/${MINIO_FLINK_BUCKET:-flink-state}" &&
        mc anonymous set none "local/${MINIO_FLINK_BUCKET:-flink-state}" &&
        mc ls "local/${MINIO_FLINK_BUCKET:-flink-state}"
    restart: "no"
    networks:
      - cdc-network

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
      - "9249:9249"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    ports:
      - "9250:9249"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://flink-jobmanager:8081/taskmanagers | grep --quiet '\"id\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - cdc-network

  # Submit the bounded SQL statement set only after every runtime dependency is
  # actually ready. This replaces the old, timing-dependent `sleep 30`.
  flink-job-submitter:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-job-submitter
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres-ready:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
    command: /opt/flink/bin/submit-cdc-job.sh
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro
    restart: "no"
    networks:
      - cdc-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-token=cdc-postgres-ha
      - --initial-cluster-state=new
      - --enable-v2=true
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - cdc-network

  pg-node-1:
    build:
      context: ./postgres-ha/patroni
      dockerfile: Dockerfile
    container_name: pg-node-1
    environment:
      PATRONI_NAME: pg-node-1
      PATRONI_ETCD_HOSTS: etcd:2379
      PATRONI_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRES_CONNECT_ADDRESS: pg-node-1
      PATRONI_REST_CONNECT_ADDRESS: pg-node-1
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "5433:5432"
      - "8008:8008"
    volumes:
      - pg_node1_data:/var/lib/postgresql/data
      - ./postgres-ha/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8008/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks:
      - cdc-network

  pg-node-2:
    build:
      context: ./postgres-ha/patroni
      dockerfile: Dockerfile
    container_name: pg-node-2
    environment:
      PATRONI_NAME: pg-node-2
      PATRONI_ETCD_HOSTS: etcd:2379
      PATRONI_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRES_CONNECT_ADDRESS: pg-node-2
      PATRONI_REST_CONNECT_ADDRESS: pg-node-2
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "5434:5432"
      - "8009:8008"
    volumes:
      - pg_node2_data:/var/lib/postgresql/data
      - ./postgres-ha/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8008/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks:
      - cdc-network

  pg-node-3:
    build:
      context: ./postgres-ha/patroni
      dockerfile: Dockerfile
    container_name: pg-node-3
    environment:
      PATRONI_NAME: pg-node-3
      PATRONI_ETCD_HOSTS: etcd:2379
      PATRONI_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRES_CONNECT_ADDRESS: pg-node-3
      PATRONI_REST_CONNECT_ADDRESS: pg-node-3
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "5435:5432"
      - "8010:8008"
    volumes:
      - pg_node3_data:/var/lib/postgresql/data
      - ./postgres-ha/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8008/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks:
      - cdc-network

  pg-haproxy:
    image: haproxy:2.9
    container_name: pg-haproxy
    depends_on:
      pg-node-1:
        condition: service_started
      pg-node-2:
        condition: service_started
      pg-node-3:
        condition: service_started
    ports:
      - "15432:5432"
      - "15433:5433"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - cdc-network

  postgres-ready:
    image: postgres:16
    container_name: postgres-ready
    depends_on:
      pg-haproxy:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
      POSTGRES_READY_TIMEOUT: 180
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        deadline=$$(( $$(date +%s) + $${POSTGRES_READY_TIMEOUT:-180} ))
        until [ "$$(date +%s)" -ge "$$deadline" ]; do
          if psql -h pg-haproxy -p 5432 -U postgres -d ecommerce_ods -Atc "SELECT NOT pg_is_in_recovery()" | grep -q t; then
            echo "PostgreSQL HA write endpoint is ready."
            exit 0
          fi
          sleep 2
        done
        echo "Timed out waiting for PostgreSQL HA write endpoint." >&2
        exit 1
    restart: "no"
    networks:
      - cdc-network
      
volumes:
  alertmanager_data:
  clickhouse_data:
  etcd_data:
  grafana_data:
  minio_data:
  pg_node1_data:
  pg_node2_data:
  pg_node3_data:

networks:
  cdc-network:
    driver: bridge
