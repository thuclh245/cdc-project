x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  jobmanager.execution.failover-strategy: full
  restart-strategy.type: failure-rate
  restart-strategy.failure-rate.max-failures-per-interval: 3
  restart-strategy.failure-rate.failure-rate-interval: 5 min
  restart-strategy.failure-rate.delay: 10 s
  state.backend.type: hashmap
  state.checkpoints.dir: file:///opt/flink/checkpoints
  execution.checkpointing.interval: 10 s
  execution.checkpointing.mode: EXACTLY_ONCE
  execution.checkpointing.timeout: 60 s
  execution.checkpointing.max-concurrent-checkpoints: 1

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-sink
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=ecommerce_ods
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cdc-network

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: >
      bash -c "
      /docker-entrypoint.sh jobmanager &
      sleep 30 &&
      sql-client.sh -f /opt/flink/jobs/postgres_to_clickhouse.sql &&
      wait
      "
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink_checkpoints_v2:/opt/flink/checkpoints
    networks:
      - cdc-network

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink_checkpoints_v2:/opt/flink/checkpoints
    networks:
      - cdc-network

  pg-primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_ods
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "listen_addresses=*"
    ports:
      - "5433:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgres-ha/primary-init:/docker-entrypoint-initdb.d
    networks:
      - cdc-network

  pg-replica-1:
    image: postgres:16
    container_name: pg-replica-1
    environment:
      PGPASSWORD: repl_password
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary...';
        until gosu postgres pg_isready -h pg-primary -p 5432 -U postgres; do
          sleep 2;
        done;
        echo 'Running pg_basebackup...';
        rm -rf /var/lib/postgresql/data/*;
        gosu postgres pg_basebackup -h pg-primary -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        chmod 700 /var/lib/postgresql/data;
        echo 'Basebackup done.';
      fi;
      exec gosu postgres postgres
      "
    depends_on:
      - pg-primary
    networks:
      - cdc-network
    ports:
      - "5434:5432"

  pg-replica-2:
    image: postgres:16
    container_name: pg-replica-2
    environment:
      PGPASSWORD: repl_password
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary...';
        until gosu postgres pg_isready -h pg-primary -p 5432 -U postgres; do
          sleep 2;
        done;
        echo 'Running pg_basebackup...';
        rm -rf /var/lib/postgresql/data/*;
        gosu postgres pg_basebackup -h pg-primary -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        chmod 700 /var/lib/postgresql/data;
        echo 'Basebackup done.';
      fi;
      exec gosu postgres postgres
      "
    depends_on:
      - pg-primary
    networks:
      - cdc-network
    ports:
      - "5435:5432"

  pg-haproxy:
    image: haproxy:2.9
    container_name: pg-haproxy
    depends_on:
      - pg-primary
      - pg-replica-1
      - pg-replica-2
    ports:
      - "15432:5432"
      - "15433:5433"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - cdc-network

volumes:
  clickhouse_data:
  flink_checkpoints_v2:
  pg_primary_data:
  pg_replica1_data:
  pg_replica2_data:

networks:
  cdc-network:
    driver: bridge
