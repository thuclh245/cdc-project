services:
  postgres:
    image: postgres:16
    container_name: pg-source
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdc_demo
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-sink
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=cdc_demo
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink_checkpoints:/opt/flink/checkpoints

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink_checkpoints:/opt/flink/checkpoints

  pg-primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdc_demo
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "listen_addresses=*"
    ports:
      - "5433:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgres-ha/primary-init:/docker-entrypoint-initdb.d

  pg-replica-1:
    image: postgres:16
    container_name: pg-replica-1
    user: postgres
    environment:
      PGPASSWORD: repl_password
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary...';
        until pg_isready -h pg-primary -p 5432 -U postgres; do
          sleep 2;
        done;
        echo 'Running pg_basebackup...';
        rm -rf /var/lib/postgresql/data/*;
        pg_basebackup -h pg-primary -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        echo 'Basebackup done.';
      fi;
      postgres
      "
    depends_on:
      - pg-primary
    networks:
      - cdc-network

  pg-replica-2:
    image: postgres:16
    container_name: pg-replica-2
    user: postgres
    environment:
      PGPASSWORD: repl_password
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary...';
        until pg_isready -h pg-primary -p 5432 -U postgres; do
          sleep 2;
        done;
        echo 'Running pg_basebackup...';
        rm -rf /var/lib/postgresql/data/*;
        pg_basebackup -h pg-primary -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        echo 'Basebackup done.';
      fi;
      postgres
      "
    depends_on:
      - pg-primary
    networks:
      - cdc-network

volumes:
  pg_data:
  clickhouse_data:
  flink_checkpoints:
  pg_primary_data:
  pg_replica1_data:
  pg_replica2_data:

networks:
  cdc-network:
    driver: bridge
